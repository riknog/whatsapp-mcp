name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: make check
        run: make check

      - name: make build
        run: make build

      - name: version smoke test
        run: bin/whatsapp-mcp version

  security:
    name: make security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make security
        run: make security
