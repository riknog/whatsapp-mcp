name: release

# Pushing a tag like v0.1.0 builds the binaries for every platform and
# publishes them, with checksums.txt, as a GitHub Release. The install
# scripts in scripts/ download from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test -count=1 ./...

      - name: build
        run: |
          set -eu
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/whatsapp-mcp_${os}_${arch}${ext}" ./cmd/whatsapp-mcp
          done
          cd dist
          sha256sum whatsapp-mcp_* > checksums.txt
          cat checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
